# Évite que le plan gratuit de Supabase mette le projet en pause après 7 jours sans activité.
# Inutile (mais sans danger) si vous passez au plan Pro.
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   SUPABASE_URL  et  SUPABASE_ANON_KEY
name: Garder Supabase actif
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la base
        run: |
          curl --fail --silent --show-error -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}'
