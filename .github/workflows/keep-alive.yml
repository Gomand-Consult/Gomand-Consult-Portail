# Évite que le plan gratuit de Supabase mette le projet en pause après 7 jours sans activité.
# Inutile (mais sans danger) si vous passez au plan Pro.
# Aucun secret requis : l'adresse du projet et la clé « publishable » sont publiques par conception
# (elles figurent déjà dans le site que visitent vos clients) et ne donnent accès à rien sans connexion.
# Si vous changez de projet Supabase, mettez à jour les deux valeurs ci-dessous.
name: Garder Supabase actif
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://goqewpwfgcakgrubwbya.supabase.co
      SUPABASE_KEY: sb_publishable_Udz9ygv-rlaf089FLFBTyA_Kd7IVpVN
    steps:
      - name: Appeler la base
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
